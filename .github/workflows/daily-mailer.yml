name: Daily Learning Mailer

on:
  schedule:
    # Her gün sabah 08:00 İstanbul saati = 05:00 UTC
    - cron: "0 5 * * *"

  # Elle de tetikleyebilmek için:
  workflow_dispatch:
    inputs:
      topic:
        description: "Öğrenmek istediğin konu (boş bırakırsan varsayılan kullanılır)"
        required: false
        default: ""

jobs:
  send-lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Günlük dersi gönder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          # workflow_dispatch'dan gelen topic varsa onu, yoksa secret'taki varsayılanı kullan
          LEARNING_TOPIC: ${{ github.event.inputs.topic || secrets.LEARNING_TOPIC }}
        run: node src/mailer.js
