name: Daily Learning Mailer

on:
  schedule:
    - cron: "0 5 * * *"

  workflow_dispatch:
    inputs:
      topic:
        description: "Öğrenmek istediğin konu"
        required: false
        default: ""

jobs:
  send-lesson:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bağımlılıkları yükle
        run: npm install

      # 🔍 DEBUG (Groq kontrol)
      - name: Debug Groq Key
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "❌ GROQ_API_KEY YOK"
            exit 1
          else
            echo "✅ GROQ API KEY VAR"
          fi
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Günlük dersi gönder
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          LEARNING_TOPIC: ${{ github.event.inputs.topic || secrets.LEARNING_TOPIC }}
        run: node src/mailer.js